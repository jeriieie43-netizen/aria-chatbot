<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aria — Assistant IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Aria</span>
      </div>
      <div class="status">
        <button type="button" id="homeBtn" class="home-btn" aria-label="Revenir à l'accueil" title="Nouvelle conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 11L12 3L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 10V20C5 20.5523 5.44772 21 6 21H9C9.55228 21 10 20.5523 10 20V15C10 14.4477 10.4477 14 11 14H13C13.5523 14 14 14.4477 14 15V20C14 20.5523 14.4477 21 15 21H18C18.5523 21 19 20.5523 19 20V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">En ligne</span>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark" aria-hidden="true"></div>
        <h1>Comment puis-je t'aider aujourd'hui ?</h1>
        <p>Pose une question, demande de l'aide sur un texte, ou choisis une idée ci-dessous.</p>
        <div class="suggestions" id="suggestions">
          <button type="button" class="chip chip-a" data-prompt="Explique-moi un sujet compliqué simplement">
            <span class="chip-dot"></span> Explique-moi un sujet
          </button>
          <button type="button" class="chip chip-b" data-prompt="Aide-moi à rédiger un email professionnel">
            <span class="chip-dot"></span> Rédige un email
          </button>
          <button type="button" class="chip chip-c" data-prompt="Donne-moi des idées créatives pour un projet">
            <span class="chip-dot"></span> Trouve des idées
          </button>
          <button type="button" class="chip chip-d" data-prompt="Résume ce texte en quelques points clés">
            <span class="chip-dot"></span> Résume un texte
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <form class="composer" id="composer">
      <textarea
        id="input"
        placeholder="Écris ton message..."
        rows="1"
        maxlength="4000"
        autofocus
      ></textarea>
      <button type="submit" id="sendBtn" aria-label="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">Aria peut se tromper. Vérifie les informations importantes.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
